<a href="{% url 'product_detail' product.id %}" class="product-card">
    {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
    {% else %}
        <div class="image-placeholder"></div>
    {% endif %}
    <div class="product-info">
        <h3>{{ product.name }}</h3>
        <p>{{ product.price }} ₸</p>
    </div>
</a>
