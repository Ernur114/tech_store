{% extends 'tech_store/base.html' %}
{% block title %}Удалить товар{% endblock %}
{% block content %}
    <main style="padding:20px;max-width:800px">
        <h2>Удалить товар</h2>
        <p>Действительно удалить товар «{{ product.name }}»?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit">Удалить</button>
            <a href="{% url 'manage_products' %}">Отмена</a>
        </form>
    </main>
{% endblock %}
